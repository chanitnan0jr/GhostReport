[project]
name = "ghostreport"
version = "0.1.0"
description = "Code-grounded, auditable investigations of wallet onboarding"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "openai>=1.50,<3",
    "pydantic>=2.12,<3",
    "uvicorn>=0.32,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "mypy>=1.15,<2",
    "ruff>=0.11,<1",
    "pip-audit>=2.9,<3",
    "httpx>=0.27,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-config --strict-markers"

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["engine"]
omit = ["engine/demo.py"]
branch = true
